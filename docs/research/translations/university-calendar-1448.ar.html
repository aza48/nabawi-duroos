<p>مواعيد الجامعة الإسلامية للعام الدراسي ١٤٤٨ إلى ١٤٤٩: بداية الدراسة، والاختبارات النهائية، والإجازات، وفترات الطلبات، وأهم المناسبات الإسلامية، مع العدّ التنازلي لكل موعد. والتواريخ الهجرية على تقويم أم القرى.</p>
