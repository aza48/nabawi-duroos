name: Overlap with other PRs

# Comments on a PR only when it overlaps another open PR: the same guide or FAQ slug, the same
# migration number, or the same source file. It never blocks a merge. Same report locally: npm run overlap
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-overlap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/pr-overlap.mjs
          sparse-checkout-cone-mode: false
      - name: Report overlaps on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-overlap.mjs --pr ${{ github.event.pull_request.number }} --comment
